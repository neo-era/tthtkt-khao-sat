<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F2A43">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khảo sát CS">
<title>Báo cáo kết quả khảo sát chiếu sáng</title>
<style>
  :root{ --ink:#0F2A43; --line:#C9D4DF; --muted:#5A6B7B; --bg:#EEF2F6; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#10202E;
    font-family:"Times New Roman",Georgia,serif;font-size:13.5px;line-height:1.45}
  /* ---- toolbar (không in) ---- */
  .toolbar{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px}
  .toolbar a.back{color:#A9C2DA;text-decoration:none;font-weight:600}
  .toolbar .sp{flex:1}
  .toolbar input{border:1px solid #3a566f;border-radius:7px;padding:6px 9px;font-size:13px;
    background:#16344c;color:#fff}
  .toolbar button{background:#1565C0;color:#fff;border:0;border-radius:8px;padding:8px 16px;
    font-weight:700;font-size:13.5px;cursor:pointer}
  .toolbar button.w{background:#2E7D32}
  .toolbar button[disabled]{opacity:.65;cursor:default}
  .toolbar label{color:#C7D7E7;font-size:12px}
  /* ---- giấy A4 ---- */
  .page{max-width:210mm;margin:14px auto;background:#fff;padding:18mm 16mm;
    box-shadow:0 1px 6px rgba(0,0,0,.15)}
  .head-org{font-size:12.5px;text-transform:uppercase;font-weight:700;text-align:center;letter-spacing:.3px}
  .head-line{width:160px;height:1px;background:#10202E;margin:3px auto 10px}
  h1{font-size:18px;text-align:center;margin:14px 0 4px;text-transform:uppercase;line-height:1.3}
  .subttl{text-align:center;font-style:italic;color:var(--muted);margin:0 0 4px}
  .cancu{text-align:center;font-style:italic;font-size:12.5px;color:#33485c;margin:8px 0 2px}
  h2{font-size:14.5px;margin:20px 0 8px;color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:3px}
  h3{font-size:13.5px;margin:14px 0 6px;color:var(--ink)}
  table{width:100%;border-collapse:collapse;margin:8px 0 6px}
  th,td{border:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left}
  th{background:#0F2A43;color:#fff;font-weight:700;text-align:center}
  .num{text-align:center;white-space:nowrap}
  .kpi{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
  .kpi .box{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#F7FAFC}
  .kpi .box b{display:block;font-size:22px;color:var(--ink);line-height:1.1}
  .kpi .box span{font-size:12px;color:var(--muted)}
  .grp{background:#E8EEF4;font-weight:700}
  .detail{font-size:10px}
  .detail th,.detail td{padding:3px 4px;word-break:break-word}
  .pr-Cao{color:#C62828;font-weight:700}
  .pr-TB{color:#B45309;font-weight:700}
  .pr-Thap{color:#1E8E3E;font-weight:700}
  textarea#ketluan{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;
    padding:8px;font-family:inherit;font-size:13.5px;resize:vertical}
  .sign{display:flex;justify-content:space-between;margin-top:26px;gap:20px}
  .sign div{text-align:center;flex:1}
  .sign .role{font-weight:700}
  .sign .hint{font-style:italic;color:var(--muted);font-size:12px}
  .sign .space{height:64px}
  .notice{max-width:600px;margin:60px auto;background:#fff;border-radius:12px;padding:28px;text-align:center;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .notice a{color:#1565C0;font-weight:700}
  /* ---- ảnh hiện trường ---- */
  .thumbs{display:flex;gap:3px;justify-content:center}
  .thumbs img{width:52px;height:70px;object-fit:cover;border:1px solid var(--line)}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
  .pitem{border:1px solid var(--line);padding:4px;background:#fff}
  .pitem img{width:100%;display:block;object-fit:cover}
  .pitem .cap{font-size:10.5px;color:var(--muted);text-align:center;padding-top:3px}
  .pblock{margin:12px 0 16px;page-break-inside:avoid}
  .pblock .hd{font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .pblock .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pmiss{font-size:11px;color:#B45309;font-style:italic}
  #anh.off{display:none}
  @media print{
    .toolbar{display:none}
    body{background:#fff;font-size:12px}
    .page{box-shadow:none;margin:0;max-width:none;padding:12mm 10mm}
    textarea#ketluan{border:0;padding:0;min-height:auto}
    h2{page-break-after:avoid}
    tr{page-break-inside:avoid}
    @page{size:A4;margin:12mm}
  }
</style>
</head>
<body>

<div class="toolbar">
  <a class="back" href="index.html">← Về app</a>
  <span class="sp"></span>
  <label>Ngày lập</label>
  <input id="tDate" size="12">
  <label>Người lập</label>
  <input id="tBy" placeholder="Họ tên" size="16">
  <label><input type="checkbox" id="tAnh" checked> In kèm phụ lục ảnh</label>
  <button class="w" id="btnWord" onclick="exportWord()">📄 Xuất Word</button>
  <button onclick="window.print()">🖨 In / Lưu PDF</button>
</div>

<div id="root"></div>

<script>
const NHACHOS = ["Nhà chờ chưa cải tạo","Đã lắp mới"];
const VITRIS  = ["Cùng phía","Đối diện"];
const LOAITRUS= ["BTLT","STK côn tròn","STK bát giác"];
const PRIOS   = ["Ưu tiên 1","Ưu tiên 2"];

function loadRaw(){ try{ return JSON.parse(localStorage.getItem("lavipco_ks_raw_v1"))||[]; }catch(e){ return []; } }
function loadStore(){ try{ return JSON.parse(localStorage.getItem("lavipco_ks_data_v3"))||{}; }catch(e){ return {}; } }
function esc(s){ return (s==null?"":""+s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function rec(store,stt){ return store[stt]||{}; }
function isDone(r){ return !!(r.lat||r.d1||r.d2||r.nhacho||r.vitri||r.loaitru||r.prio||r.note||(r.photos&&r.photos.length)); }
/* Ảnh: ưu tiên dataURL còn trên máy (luôn hiện được), nếu đã lên Drive thì lấy ảnh
   thu nhỏ theo ID. Ảnh Drive cần có mạng + file để chế độ "ai có link cũng xem". */
function photoList(c){
  return (c.photos||[]).filter(Boolean).map((p,i)=>({
    i:i+1, d:p.d||"", id:p.id||"",
    href:p.url||(p.id?("https://drive.google.com/file/d/"+p.id+"/view"):"")
  }));
}
function photoImg(p,w){
  if(p.d) return '<img src="'+p.d+'" alt="Ảnh '+p.i+'">';
  if(p.id) return '<img data-fallback="1" src="https://drive.google.com/thumbnail?id='+p.id+'&sz=w'+w+'" alt="Ảnh '+p.i+'">';
  return '<div class="pmiss">Chưa tải lên</div>';
}
function photoCell(c){
  const l=photoList(c);
  if(!l.length) return "—";
  return '<div class="thumbs">'+l.map(p=>photoImg(p,200)).join("")+'</div>';
}
function pad(n){ return String(n).padStart(2,"0"); }
function today(){ const d=new Date(); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(); }

const RAW = loadRaw();
const STORE = loadStore();

if(!RAW.length){
  document.getElementById("root").innerHTML =
    '<div class="notice"><h2 style="border:0">Chưa có dữ liệu danh mục</h2>'+
    '<p>Hãy mở <a href="index.html">app khảo sát</a> trước (ít nhất một lần) để nạp danh mục vị trí, rồi quay lại trang báo cáo này.</p></div>';
} else {
  render();
}

function render(){
  const total = RAW.length;
  const done = RAW.filter(r=>isDone(rec(STORE,r.stt)));
  const pending = RAW.filter(r=>!isDone(rec(STORE,r.stt)));
  const hasGps = done.filter(r=>rec(STORE,r.stt).lat).length;

  // theo khu vực – phường/xã
  const dbMap = {}; const dbOrder = [];
  RAW.forEach(r=>{
    const k=(r.diaban||"(Khác)")+"|"+(r.phuong||"(Khác)");
    if(!dbMap[k]){ dbMap[k]={total:0,done:0}; dbOrder.push(k); }
    dbMap[k].total++; if(isDone(rec(STORE,r.stt))) dbMap[k].done++;
  });
  const dbRows = dbOrder.map(k=>{
    const o=dbMap[k], p=k.split("|");
    return '<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td><td class="num">'+o.total+'</td><td class="num">'+
      o.done+'</td><td class="num">'+(o.total-o.done)+'</td><td class="num">'+
      (o.total?Math.round(o.done/o.total*100):0)+'%</td></tr>';
  }).join("");

  // bảng đếm theo một trường phân loại
  function tally(field, opts){
    const c = {}; opts.forEach(o=>c[o]=0);
    done.forEach(r=>{ const v=rec(STORE,r.stt)[field]; if(v&&c[v]!=null) c[v]++; });
    return opts.map(o=>'<tr><td>'+o+'</td><td class="num">'+c[o]+'</td><td class="num">'+
      (done.length?Math.round(c[o]/done.length*100):0)+'%</td></tr>').join("");
  }
  const nhachoRows  = tally("nhacho",  NHACHOS);
  const vitriRows   = tally("vitri",   VITRIS);
  const loaitruRows = tally("loaitru", LOAITRUS);
  const prioRows    = tally("prio",    PRIOS);

  // khoảng cách trung bình (chỉ tính các ô có nhập số)
  function avg(field){
    const xs = done.map(r=>parseFloat(String(rec(STORE,r.stt)[field]||"").replace(",","."))).filter(v=>!isNaN(v));
    return xs.length ? (xs.reduce((a,b)=>a+b,0)/xs.length).toFixed(1)+" m (n="+xs.length+")" : "—";
  }

  // bảng chi tiết theo địa bàn
  let detail=""; let curG=null;
  done.forEach((r,i)=>{
    const c=rec(STORE,r.stt);
    const g=r.phuong+" · "+r.diaban;
    if(g!==curG){ curG=g;
      detail+='<tr class="grp"><td colspan="14">'+esc(curG)+'</td></tr>'; }
    const gps = c.lat? (c.lat+", "+c.lng) : "—";
    const prCls = c.prio==="Ưu tiên 1"?"pr-Cao":(c.prio==="Ưu tiên 2"?"pr-TB":"");
    detail+='<tr>'+
      '<td class="num">'+(i+1)+'</td>'+
      '<td class="num">'+esc(r.stt)+'</td>'+
      '<td class="num">'+esc(r.ma||"—")+'</td>'+
      '<td><b>'+esc(r.duong)+'</b><br>'+esc(r.sonha||"—")+'</td>'+
      '<td>'+esc(r.loai||"—")+'</td>'+
      '<td>'+esc(gps)+'</td>'+
      '<td class="num">'+esc(c.d1||"—")+'</td>'+
      '<td class="num">'+esc(c.d2||"—")+'</td>'+
      '<td>'+esc(c.nhacho||"—")+'</td>'+
      '<td>'+esc(c.vitri||"—")+'</td>'+
      '<td>'+esc(c.loaitru||"—")+'</td>'+
      '<td class="'+prCls+'">'+esc(c.prio||"—")+'</td>'+
      '<td>'+photoCell(c)+'</td>'+
      '<td>'+esc(c.by||"—")+'</td>'+
      '</tr>';
    if(c.note){ detail+='<tr><td></td><td colspan="13"><i>Ghi chú: '+esc(c.note)+'</i></td></tr>'; }
  });
  if(!done.length) detail='<tr><td colspan="14" class="num">Chưa có vị trí nào được khảo sát.</td></tr>';

  // phụ lục chưa khảo sát
  // phụ lục ảnh hiện trường
  let anh=""; let nAnh=0, nViTri=0;
  done.forEach(r=>{
    const c=rec(STORE,r.stt), l=photoList(c);
    if(!l.length) return;
    nAnh+=l.length; nViTri++;
    anh+='<div class="pblock">'+
      '<div class="hd">'+esc(r.stt+". "+r.duong+(r.sonha?" – "+r.sonha:""))+'</div>'+
      '<div class="sub">'+esc([r.phuong,r.diaban].join(" · "))+
        (c.lat?(" · GPS "+esc(c.lat+", "+c.lng)):"")+(c.prio?(" · "+esc(c.prio)):"")+'</div>'+
      '<div class="pgrid">'+l.map(p=>'<div class="pitem">'+photoImg(p,800)+
        '<div class="cap">Ảnh '+p.i+(p.href?"":" — chưa tải lên Drive")+'</div></div>').join("")+
      '</div></div>';
  });
  if(!anh) anh='<p><i>Chưa có ảnh hiện trường nào được đính kèm.</i></p>';

  const PEND_MAX=500;
  let pendRows="";
  pending.slice(0,PEND_MAX).forEach((r,i)=>{ pendRows+='<tr><td class="num">'+(i+1)+'</td><td>'+esc(r.diaban)+'</td><td>'+
    esc(r.phuong)+'</td><td>'+esc(r.duong)+'</td><td>'+esc(r.sonha||"—")+'</td></tr>'; });
  if(pending.length>PEND_MAX) pendRows+='<tr><td colspan="5"><i>… và '+(pending.length-PEND_MAX)+
    ' vị trí khác chưa khảo sát (xem đầy đủ trong file CSV xuất từ app).</i></td></tr>';
  if(!pending.length) pendRows='<tr><td colspan="5" class="num">Đã khảo sát toàn bộ vị trí.</td></tr>';

  document.getElementById("root").innerHTML = `
  <div class="page">
    <div class="head-org">Chiếu sáng khu vực Trung Tâm</div>
    <div class="head-line"></div>

    <h1>Tổng hợp kết quả khảo sát,<br>tính toán lựa chọn bộ đèn LED</h1>
    <p class="subttl">Tại các trạm dừng xe buýt địa bàn Quận 1, 3, 5, 8, 10, 11, Phú Nhuận, Bình Thạnh</p>
    <p class="cancu">Căn cứ Danh sách trạm dừng xe buýt do Trung tâm Quản lý Giao thông công cộng (Sở Xây dựng TP.HCM) quản lý — ${total} vị trí thuộc phạm vi khảo sát.</p>
    <p class="cancu" id="cDate">Ngày lập báo cáo: ${today()}</p>

    <h2>I. Tổng quan kết quả khảo sát</h2>
    <div class="kpi">
      <div class="box"><b>${total}</b><span>Tổng số vị trí</span></div>
      <div class="box"><b>${done.length}</b><span>Đã khảo sát (${total?Math.round(done.length/total*100):0}%)</span></div>
      <div class="box"><b>${pending.length}</b><span>Chưa khảo sát</span></div>
      <div class="box"><b>${hasGps}</b><span>Có tọa độ GPS</span></div>
    </div>
    <h3>Phân bố theo địa bàn – phường/xã</h3>
    <table>
      <tr><th>Địa bàn</th><th>Phường/Xã</th><th>Tổng</th><th>Đã KS</th><th>Chưa KS</th><th>Tỷ lệ</th></tr>
      ${dbRows}
      <tr class="grp"><td colspan="2"><b>Tổng cộng</b></td><td class="num"><b>${total}</b></td><td class="num"><b>${done.length}</b></td><td class="num"><b>${pending.length}</b></td><td class="num"><b>${total?Math.round(done.length/total*100):0}%</b></td></tr>
    </table>

    <h2>II. Thống kê hiện trạng trụ dừng / nhà chờ</h2>
    <p><i>(Trên ${done.length} vị trí đã khảo sát)</i></p>
    <h3>Loại trụ dừng, nhà chờ</h3>
    <table>
      <tr><th>Loại</th><th>Số vị trí</th><th>Tỷ lệ</th></tr>
      ${nhachoRows}
    </table>
    <h3>Vị trí trụ đèn so với nhà chờ</h3>
    <table>
      <tr><th>Vị trí</th><th>Số vị trí</th><th>Tỷ lệ</th></tr>
      ${vitriRows}
    </table>
    <h3>Loại trụ đèn hiện hữu</h3>
    <table>
      <tr><th>Loại trụ</th><th>Số vị trí</th><th>Tỷ lệ</th></tr>
      ${loaitruRows}
    </table>

    <h2>III. Khoảng cách & mức ưu tiên đề xuất</h2>
    <table>
      <tr><th>Chỉ tiêu</th><th>Giá trị trung bình</th></tr>
      <tr><td>Khoảng cách trụ đèn → trụ dừng / nhà chờ (theo hướng xe lưu thông)</td><td class="num">${avg("d1")}</td></tr>
      <tr><td>Khoảng cách trụ dừng / nhà chờ → trụ đèn tiếp theo</td><td class="num">${avg("d2")}</td></tr>
    </table>
    <h3>Phân loại theo mức ưu tiên đề xuất</h3>
    <table>
      <tr><th>Mức ưu tiên</th><th>Số vị trí</th><th>Tỷ lệ</th></tr>
      ${prioRows}
    </table>

    <h2>IV. Tổng hợp kết quả tính toán lựa chọn bộ đèn LED</h2>
    <table class="detail">
      <tr>
        <th>TT</th><th>STT danh mục</th><th>Mã điểm dừng</th><th>Tuyến đường / Vị trí</th><th>Hạ tầng</th><th>Tọa độ GPS</th>
        <th>KC trụ đèn → trụ dừng (m)</th><th>KC trụ dừng → trụ đèn kế (m)</th>
        <th>Loại trụ dừng, nhà chờ</th><th>Vị trí trụ so với nhà chờ</th><th>Loại trụ đèn</th>
        <th>Ưu tiên đề xuất</th><th>Ảnh hiện trường</th><th>Người KS</th>
      </tr>
      ${detail}
    </table>

    <h2>V. Phụ lục: Vị trí chưa khảo sát</h2>
    <table>
      <tr><th>TT</th><th>Khu vực</th><th>Phường/Xã</th><th>Tuyến đường</th><th>Số nhà/Vị trí</th></tr>
      ${pendRows}
    </table>

    <div id="anh">
      <h2>VI. Phụ lục ảnh hiện trường</h2>
      <p><i>${nAnh} ảnh tại ${nViTri} vị trí. Mỗi ảnh đã được đóng dấu địa chỉ, tọa độ GPS
      và thời gian chụp ngay tại thời điểm khảo sát.</i></p>
      ${anh}
    </div>

    <h2>VII. Kết luận & kiến nghị</h2>
    <textarea id="ketluan">Qua khảo sát ${done.length}/${total} vị trí, đơn vị kiến nghị bổ sung bộ đèn LED chiếu sáng tại các trụ dừng / nhà chờ xe buýt còn thiếu chiếu sáng, thực hiện trước các vị trí thuộc Ưu tiên 1. Kính trình cấp có thẩm quyền xem xét, chấp thuận chủ trương và bố trí kinh phí thực hiện.</textarea>

    <div class="sign">
      <div>
        <div class="role">NGƯỜI LẬP BÁO CÁO</div>
        <div class="hint">(Ký, ghi rõ họ tên)</div>
        <div class="space"></div>
        <div id="sBy"></div>
      </div>
      <div>
        <div class="role">XÁC NHẬN CỦA ĐƠN VỊ</div>
        <div class="hint">(Ký, đóng dấu)</div>
        <div class="space"></div>
        <div>&nbsp;</div>
      </div>
    </div>
  </div>`;

  // Ảnh Drive không tải được (mất mạng, hoặc file chưa để "ai có link cũng xem")
  // → thay bằng dòng chữ, đừng để ô trống khó hiểu trên bản in.
  document.querySelectorAll("img[data-fallback]").forEach(im=>{
    im.onerror=()=>{
      const d=document.createElement("div"); d.className="pmiss";
      d.textContent="Không tải được ảnh — kiểm tra mạng & quyền chia sẻ trên Drive";
      im.replaceWith(d);
    };
  });

  // bật/tắt phụ lục ảnh
  const aEl=document.getElementById("tAnh"), anhSec=document.getElementById("anh");
  const syncAnh=()=>{ if(anhSec) anhSec.classList.toggle("off", !aEl.checked); };
  aEl.addEventListener("change",syncAnh); syncAnh();

  // toolbar liên kết
  const dEl=document.getElementById("tDate"), bEl=document.getElementById("tBy");
  dEl.value=today();
  bEl.value=localStorage.getItem("lavipco_ks_by")||"";
  const sync=()=>{
    document.getElementById("cDate").textContent="Ngày lập báo cáo: "+(dEl.value||today());
    document.getElementById("sBy").textContent=bEl.value||"";
  };
  dEl.addEventListener("input",sync); bEl.addEventListener("input",sync); sync();
}

/* ============================ XUẤT FILE WORD ============================
   Không được thêm thư viện ngoài → dựng tay file MHTML (multipart/related)
   rồi đặt đuôi .doc. Word mở thẳng, ảnh nằm luôn trong file, không cần mạng
   lúc mở lại.

   Vì sao không nhúng base64 vào thẳng <img src="data:...">: cách đó gọn hơn
   nhiều nhưng Word bản desktop KHÔNG hiện ảnh data URI — mở ra chỉ thấy ô
   trống. Tách ảnh thành từng phần MIME là cách duy nhất chạy được mà không
   cần thư viện đóng gói .docx.

   Word cũng không hiểu flex/grid → phải đổi các khối .kpi/.pgrid/.sign
   sang <table> trước khi xuất. */

const WORD_CSS = `

div.WordSection1{page:WordSection1}
@page WordSection2{size:29.7cm 21cm;margin:1.5cm 2cm 1.5cm 2cm;mso-page-orientation:landscape}
div.WordSection2{page:WordSection2}
@page WordSection3{size:21cm 29.7cm;margin:2cm 1.5cm 2cm 3cm;mso-page-orientation:portrait}
div.WordSection3{page:WordSection3}

function stampFile(){
  const d=new Date();
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes());
}
function b64Bytes(bytes){
  let bin=""; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);
}
function b64Utf8(s){ return b64Bytes(new TextEncoder().encode(s)); }
/* MIME yêu cầu dòng base64 không quá 76 ký tự. Cắt bằng vòng lặp chứ không
   dùng regex — file ảnh nhiều thì chuỗi lên hàng chục MB, regex toàn cục rất chậm. */
function wrap76(s){
  const out=[];
  for(let i=0;i<s.length;i+=76) out.push(s.substr(i,76));
  return out.join("\r\n");
}

/* Ảnh đã lên Drive: JS không đọc trực tiếp được (Drive không mở CORS) nên
   thử tải thẳng một lần, hỏng thì chuyển sang lấy qua Apps Script (?action=img).
   Nhớ kết quả lần đầu để khỏi thử lại vô ích cho hàng trăm ảnh sau. */
let driveTrucTiep=null;
function backendUrl(){ return (localStorage.getItem("lavipco_ks_url_run")||"").trim(); }
async function taiAnhDrive(id){
  if(driveTrucTiep!==false){
    try{
      const r=await fetch("https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w1000");
      if(r.ok){
        const b=await r.blob();
        if(b.size>0 && /^image\//.test(b.type||"")){
          driveTrucTiep=true;
          return {mime:b.type, b64:b64Bytes(new Uint8Array(await b.arrayBuffer()))};
        }
      }
    }catch(e){ /* CORS chặn — chuyển hướng lấy qua backend */ }
    driveTrucTiep=false;
  }
  const base=backendUrl();
  if(!base) return null;
  // w=1000: xin bản thu nhỏ cho nhẹ file. Bản Apps Script cũ chưa hiểu tham số
  // này thì bỏ qua và trả ảnh gốc — vẫn chạy, chỉ là file nặng hơn.
  const r=await fetch(base+"?action=img&w=1000&id="+encodeURIComponent(id));
  const js=await r.json();
  if(!js || !js.ok || !js.data) return null;
  return {mime:js.mime||"image/jpeg", b64:js.data};
}
function taiAnhDataUrl(src){
  const m=/^data:([^;,]+)[^,]*,(.*)$/.exec(src);
  if(!m) return null;
  return {mime:m[1], b64:m[2]};
}
function driveId(src){
  const m=/[?&]id=([^&]+)/.exec(src||"");
  return m?decodeURIComponent(m[1]):"";
}

/* Đổi các khối flex/grid sang bảng — Word chỉ dàn trang được bằng <table>. */
function wordHoaBoCuc(page){
  page.querySelectorAll(".head-line").forEach(d=>{
    const p=document.createElement("p"); p.className="hline"; d.replaceWith(p);
  });
  page.querySelectorAll(".kpi").forEach(k=>{
    const t=document.createElement("table"); t.className="kpi";
    const tr=document.createElement("tr");
    k.querySelectorAll(".box").forEach(b=>{
      const td=document.createElement("td");
      const v=b.querySelector("b"), l=b.querySelector("span");
      td.innerHTML='<p class="kpin">'+esc(v?v.textContent:"")+'<\/p>'+
                   '<p class="kpil">'+esc(l?l.textContent:"")+'<\/p>';
      tr.appendChild(td);
    });
    t.appendChild(tr); k.replaceWith(t);
  });
  page.querySelectorAll(".pgrid").forEach(g=>{
    const items=Array.prototype.slice.call(g.children);
    const t=document.createElement("table"); t.className="pgrid";
    for(let i=0;i<items.length;i+=3){
      const tr=document.createElement("tr");
      for(let j=0;j<3;j++){
        const td=document.createElement("td");
        if(items[i+j]) Array.prototype.slice.call(items[i+j].childNodes).forEach(n=>td.appendChild(n));
        else td.innerHTML="&nbsp;";
        tr.appendChild(td);
      }
      t.appendChild(tr);
    }
    g.replaceWith(t);
  });
  page.querySelectorAll(".sign").forEach(s=>{
    const cells=Array.prototype.slice.call(s.children);
    const t=document.createElement("table"); t.className="sign";
    const tr=document.createElement("tr");
    cells.forEach(c=>{
      const td=document.createElement("td");
      Array.prototype.slice.call(c.childNodes).forEach(n=>td.appendChild(n));
      tr.appendChild(td);
    });
    t.appendChild(tr); s.replaceWith(t);
  });
  // Chừa chỗ ký: Word không giữ chiều cao của <div> rỗng, phải dùng dòng trống.
  page.querySelectorAll(".space").forEach(d=>{ d.innerHTML="<p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p>"; });
  // Ô kết luận là <textarea> — nội dung đang gõ không nằm trong DOM đã nhân bản.
  const kl=page.querySelector("#ketluan");
  if(kl){
    const live=document.getElementById("ketluan");
    const p=document.createElement("p");
    p.textContent=live?live.value:kl.textContent;
    kl.replaceWith(p);
  }
}

/* Bảng chi tiết 13 cột không đọc nổi trên khổ dọc → cắt riêng thành một
   section ngang. Word đổi hướng giấy theo từng div.WordSectionN. */
function catSection(page){
  const s=[document.createElement("div"),document.createElement("div"),document.createElement("div")];
  s[0].className="WordSection1"; s[1].className="WordSection2"; s[2].className="WordSection3";
  let cur=0;
  Array.prototype.slice.call(page.childNodes).forEach(n=>{
    if(n.nodeType===1 && n.tagName==="H2"){
      const t=n.textContent.trim();
      if(t.indexOf("IV.")===0) cur=1;
      else if(t.indexOf("V.")===0) cur=2;
    }
    s[cur].appendChild(n);
  });
  return s.map(d=>d.outerHTML).join("");
}

async function exportWord(){
  const page0=document.querySelector(".page");
  if(!page0){ alert("Chưa có dữ liệu để xuất. Hãy mở app khảo sát trước."); return; }
  const btn=document.getElementById("btnWord");
  const nhan=btn.textContent;
  btn.disabled=true;
  try{
    const coAnh=document.getElementById("tAnh").checked;
    const page=page0.cloneNode(true);

    if(!coAnh){
      const sec=page.querySelector("#anh"); if(sec) sec.remove();
      // Bỏ luôn ảnh nhỏ trong bảng chi tiết: không in phụ lục nghĩa là muốn file nhẹ.
      page.querySelectorAll(".thumbs").forEach(t=>{
        const n=t.querySelectorAll("img").length;
        const p=document.createElement("span"); p.textContent=n?(n+" ảnh"):"—";
        t.replaceWith(p);
      });
    }

    /* Lập danh sách ảnh cần lấy. Mỗi tấm chỉ tải 1 lần dù xuất hiện cả ở bảng
       chi tiết lẫn phụ lục — khóa theo file ID chứ không theo URL, vì hai chỗ
       gọi Drive với sz khác nhau. Đếm tiến độ cũng theo số ảnh THẬT phải tải,
       không theo số thẻ <img> (784 thẻ nhưng chỉ ~392 tấm). */
    const imgs=Array.prototype.slice.call(page.querySelectorAll("img"));
    const khoaCua=im=>{
      const src=im.getAttribute("src")||"";
      return (/^data:/.test(src) ? "" : driveId(src)) || src;
    };
    const khoa=[], nguon={};
    imgs.forEach(im=>{
      const src=im.getAttribute("src")||"";
      const k=khoaCua(im);
      if(!(k in nguon)){ nguon[k]={id:/^data:/.test(src)?"":driveId(src), src:src}; khoa.push(k); }
    });
    const nDrive=khoa.filter(k=>nguon[k].id).length;

    // Vài trăm ảnh thì tải lâu và file rất nặng — báo trước để khỏi ngồi chờ mù.
    if(khoa.length>60 && !confirm(
        "Báo cáo có "+khoa.length+" ảnh"+(nDrive?(" (trong đó "+nDrive+" ảnh phải tải từ Google Drive)"):"")+".\n\n"+
        "Dự kiến mất khoảng "+Math.max(1,Math.ceil(nDrive/240))+"–"+Math.max(2,Math.ceil(nDrive/60))+" phút, "+
        "file nặng cỡ "+Math.round(khoa.length*0.06)+"–"+Math.round(khoa.length*0.15)+" MB. "+
        "File càng nặng thì Word mở càng chậm.\n\n"+
        "Bấm OK để tiếp tục xuất kèm ảnh.\n"+
        "Bấm Cancel để dừng — muốn bản nhẹ thì bỏ tick “In kèm phụ lục ảnh” rồi xuất lại.")) return;

    const media=[], tenFile={};
    let hong=0, xong=0;
    async function layMot(k,i){
      const o=nguon[k];
      let a=null;
      try{ a = o.id ? await taiAnhDrive(o.id) : taiAnhDataUrl(o.src); }catch(e){ a=null; }
      if(a){
        const n="image"+("000"+(i+1)).slice(-3)+(/png/.test(a.mime)?".png":".jpg");
        tenFile[k]=n;
        media.push({name:n, mime:a.mime, b64:a.b64});
      }else{ tenFile[k]=null; hong++; }
      btn.textContent="Đang lấy ảnh "+(++xong)+"/"+khoa.length+"…";
    }

    /* Tải song song, nếu không thì hàng trăm ảnh mỗi tấm chờ 1 lượt đi–về sẽ
       mất cả chục phút. Nhưng tấm đầu tiên có ảnh Drive phải chạy MỘT MÌNH để
       dò xem Drive có cho đọc thẳng không (driveTrucTiep) — bung song song ngay
       thì 5 luồng cùng dò, cùng hỏng, cùng gọi lại backend. */
    let kt=0;
    while(kt<khoa.length && driveTrucTiep===null){ await layMot(khoa[kt],kt); kt++; }
    const CUNG_LUC=5;   // đủ nhanh mà không dội quá nhiều yêu cầu vào Apps Script
    await Promise.all(Array.from({length:Math.min(CUNG_LUC,Math.max(0,khoa.length-kt))},
      async ()=>{ while(kt<khoa.length){ const i=kt++; await layMot(khoa[i],i); } }));

    imgs.forEach(im=>{
      const n=tenFile[khoaCua(im)];
      if(n){
        const rong=im.closest(".thumbs")?45:195;
        im.setAttribute("src",n);
        im.setAttribute("width",rong);
        im.removeAttribute("data-fallback");
        im.setAttribute("style","width:"+rong+"px");
      }else{
        const d=document.createElement("p"); d.className="pmiss";
        d.textContent="Không lấy được ảnh (cần mạng và quyền chia sẻ trên Drive)";
        im.replaceWith(d);
      }
    });

    btn.textContent="Đang dựng file…";
    wordHoaBoCuc(page);
    const than=catSection(page);
    const tieude="Bao cao ket qua khao sat chieu sang tram dung xe buyt";
    /* CẢNH BÁO — chuỗi HTML dưới đây nằm ngay trong khối script của chính trang
       này, nên KHÔNG được viết trần hai thứ:
         1. thẻ đóng: phải viết "<\/div>" thay vì "</div>";
         2. dấu mở/đóng chú thích HTML: phải nối chuỗi ("<!"+"--" và "--"+">").
       Viết trần thì bộ phân tích HTML cắt khối script ngay tại đó: phần code còn
       lại đổ ra màn hình thành một mảng chữ và cả trang báo cáo chết theo.
       Ngay cả trong chú thích JS như đoạn này cũng không được viết trần.
       ("<\/" trong chuỗi JS vẫn cho ra đúng ký tự cần, file Word không đổi.) */
    const dkWord = "<!"+"--[if gte mso 9]><xml><w:WordDocument>"+
      "<w:View>Print<\/w:View><w:Zoom>100<\/w:Zoom><w:DoNotOptimizeForBrowser/>"+
      "<\/w:WordDocument><\/xml><![endif]--"+">";
    const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" '+
      'xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
      '<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8">'+
      '<title>'+esc(tieude)+'<\/title>'+dkWord+
      '<style>'+WORD_CSS+'<\/style><\/head><body lang="VI">'+than+'<\/body><\/html>';

    // Gói MHTML: phần HTML + từng ảnh là một phần MIME riêng, nối với nhau
    // qua Content-Location (src trong HTML phải trùng tên file ở đây).
    const B="----=_NextPart_KS_CSTT_01", BASE="file:///C:/khaosat/";
    const parts=["MIME-Version: 1.0\r\n"+
      'Content-Type: multipart/related; type="text/html"; boundary="'+B+'"\r\n\r\n'+
      "--"+B+"\r\nContent-Location: "+BASE+"baocao.htm\r\n"+
      'Content-Type: text/html; charset="utf-8"\r\n'+
      "Content-Transfer-Encoding: base64\r\n\r\n"+wrap76(b64Utf8(html))+"\r\n\r\n"];
    media.forEach(m=>{
      parts.push("--"+B+"\r\nContent-Location: "+BASE+m.name+"\r\n"+
        "Content-Type: "+m.mime+"\r\n"+
        "Content-Transfer-Encoding: base64\r\n\r\n"+wrap76(m.b64)+"\r\n\r\n");
    });
    parts.push("--"+B+"--\r\n");

    const blob=new Blob(parts,{type:"application/msword"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="Bao_cao_khao_sat_chieu_sang_tram_dung_xe_buyt_"+stampFile()+".doc";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),10000);

    const mb=(blob.size/1048576).toFixed(1);
    alert("Đã tạo file Word ("+mb+" MB, "+media.length+" ảnh)."+
      (hong?("\n\n"+hong+" ảnh không lấy được — kiểm tra mạng, hoặc quyền chia sẻ file trên Drive."):"")+
      "\n\nMở bằng Microsoft Word. Nếu Word hỏi \"chế độ xem được bảo vệ\" thì bấm Cho phép chỉnh sửa.");
  }catch(err){
    alert("Không xuất được file Word: "+err);
  }finally{
    btn.disabled=false; btn.textContent=nhan;
  }
}
</script>
